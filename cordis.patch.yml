# dsh-skill-starter：技能管理器插件（DeepSeek Harness 插件）。
#
# 安装即同时注册：
#   1. 插件自带的 6 个基础技能（ask-first / plain-words / prove-it / tiny-steps / write-my-skill / setup-tickets）
#   2. 六个工具：skill_list / skill_read / skill_write / skill_delete / skill_pack_list / skill_pack_install
